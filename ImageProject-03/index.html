<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>
  <body>
    <a-scene>

      <a-assets>
        <a-asset-item id="tree" src="assets/Lowpoly_tree_sample.obj"></a-asset-item>
        <img id="sky1" src="assets/sky1.jpg">
        <img id="tex1" src="assets/texture1.jpg">
        <img id="tex2" src="assets/texture2.jpg">
        <img id="tex3" src="assets/texture3.jpg">
        <img id="tex4" src="assets/texture4.jpg">
        <img id="plane" src="assets/plane.jpg">
      </a-assets>
      
      <a-obj-model src="#tree" position="-10 0 -10" rotation="0 45 0" scale=".25 .25 .25" color="#4b6e4e"></a-obj-model>
      <a-obj-model src="#tree" position="-15 0 -20" scale=".25 .25 .25" color="#246b2a"></a-obj-model>
      <a-obj-model src="#tree" position="-4 0 -20" scale=".25 .25 .25" color="#1a5403"></a-obj-model>
      <a-obj-model src="#tree" position="-15 0 -8" scale=".25 .25 .25" color="#035417"></a-obj-model>
      
      <a-cone position="0 0 0" radius="0.5" height="2.5" color="#592e02"></a-cone>
      <a-cone position="0 0 3" radius="0.5" height="2.5" color="#694302"></a-cone>
      <a-cone position="0 0 6" radius="0.5" height="2.5" color="#1a5403"></a-cone>
      <a-cone position="0 0 9" radius="0.5" height="2.5" color="#035417"></a-cone>

      <a-plane src="#plane" position="0 0 0" rotation="-90 0 0" width="60" height="60" color="green"></a-plane>
      <a-sky src="#sky1" radius="30" color="#334d07"></a-sky>
    </a-scene>
  </body>
</html>
